[project]
name = "doomrl"
version = "0.1.0"
description = "PPO agents for ViZDoom scenarios"
requires-python = ">=3.10,<3.14"
dependencies = [
    "vizdoom>=1.2.4",
    "gymnasium>=1.0",
    "stable-baselines3>=2.9",
    "torch>=2.4",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imageio>=2.35",
    "tensorboard>=2.17",
]

[project.scripts]
doomrl = "doomrl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doomrl*"]